name: Krono
options:
  bundleIdPrefix: com.samarth.krono

settings:
  SWIFT_VERSION: "5.9"

targets:
  Krono-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - path: Resources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samarth.krono.mac
      INFOPLIST_FILE: Resources/Info-macOS.plist
      CODE_SIGN_ENTITLEMENTS: Resources/Krono-macOS.entitlements
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
      ENABLE_HARDENED_RUNTIME: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Krono-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Resources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samarth.krono.ios
      INFOPLIST_FILE: Resources/Info-iOS.plist
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
